<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Smiller Onboarding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #46a0bf;
            --light-blue: #8fcad8;
            --danger: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --dark-gray: #2c3e50;
            --light-gray: #ecf0f1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f7fa;
            color: var(--dark-gray);
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--light-blue) 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            color: var(--primary-blue);
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-gray);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #3a8ba3;
        }

        .error {
            color: var(--danger);
            margin-top: 10px;
            font-size: 0.9em;
        }

        /* Admin Panel */
        .admin-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .admin-header h1 {
            color: var(--primary-blue);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-btn {
            padding: 12px;
            border: 2px solid var(--light-gray);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .tab-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .tab-btn:hover {
            border-color: var(--primary-blue);
        }

        .editor-panel {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .editor-panel.active {
            display: block;
        }

        .editor-panel h2 {
            color: var(--primary-blue);
            margin-bottom: 20px;
            border-bottom: 3px solid var(--light-blue);
            padding-bottom: 10px;
        }

        .editor-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid var(--primary-blue);
        }

        .editor-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark-gray);
        }

        .editor-section input,
        .editor-section textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        .editor-section textarea {
            min-height: 120px;
            resize: vertical;
        }

        .editor-section input:focus,
        .editor-section textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .image-preview {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid var(--light-gray);
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 4px;
            object-fit: contain;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn-save {
            background: var(--success);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save:hover {
            background: #229954;
        }

        .btn-cancel {
            background: var(--light-gray);
            color: var(--dark-gray);
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .status-message {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        small {
            color: #999;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- LOGIN FORM - APENAS EMAIL, SEM SENHA -->
    <div class="login-container" id="loginSection">
        <div class="login-box">
            <h1>🔐 Admin Smiller</h1>
            <p>Painel de Edição de Conteúdo</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="seu@email.com" value="isadora.guardia@smiller.com.br">
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>
                <div class="error" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-container" id="adminSection">
        <div class="admin-header">
            <div>
                <h1>📝 Editor de Conteúdo</h1>
                <p>Edite as abas do onboarding Smiller</p>
            </div>
            <button class="btn-logout" onclick="logout()">🚪 Sair</button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="tab-buttons" id="tabButtons"></div>

        <div id="editorsContainer"></div>

        <div class="action-buttons" style="justify-content: space-between;">
            <div>
                <small style="color: #999;">Última atualização: <span id="lastUpdate">--</span></small>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-cancel" onclick="resetChanges()">↻ Descartar</button>
                <button class="btn-save" onclick="saveChanges()">💾 Salvar Tudo</button>
            </div>
        </div>
    </div>

    <script>
        const REPO = 'isadoraguardia-web/smiller-onboarding';
        const ADMIN_EMAIL = 'isadora.guardia@smiller.com.br';

        const TABS = [
            { id: 'inicio', label: 'Início' },
            { id: 'empresa', label: 'Sobre Smiller' },
            { id: 'processos', label: 'Processos' },
            { id: 'ferramentas', label: 'Ferramentas' },
            { id: 'escalacao', label: 'Escalação' },
            { id: 'termometro', label: 'Termometro' },
            { id: 'mensagens', label: 'Mensagens' },
            { id: 'casos', label: 'Casos Reais' },
            { id: 'tutoriais', label: 'Tutoriais' },
            { id: 'quiz', label: 'Quiz' },
            { id: 'checklist', label: 'Checklist' },
            { id: 'athena', label: 'Athena' }
        ];

        let contentData = {};
        let hasChanges = false;

        // LOGIN - APENAS EMAIL, SEM VERIFICAÇÃO DE SENHA
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            if (email === ADMIN_EMAIL) {
                localStorage.setItem('adminLogin', 'true');
                showAdmin();
                loadContent();
            } else {
                document.getElementById('loginError').textContent = 'Email não autorizado';
            }
        });

        function showAdmin() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
        }

        function hideAdmin() {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('adminSection').style.display = 'none';
        }

        async function loadContent() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${REPO}/main/content.json`);
                if (response.ok) {
                    contentData = await response.json();
                } else {
                    contentData = {};
                    TABS.forEach(tab => {
                        contentData[tab.id] = { descricao: 'Conteúdo vazio. Comece a editar aqui.' };
                    });
                }
                renderEditors();
            } catch (error) {
                console.error('Erro ao carregar:', error);
                showStatus('Erro ao carregar conteúdo', 'error');
            }
        }

        function renderEditors() {
            const container = document.getElementById('editorsContainer');
            const tabButtons = document.getElementById('tabButtons');

            container.innerHTML = '';
            tabButtons.innerHTML = '';

            TABS.forEach((tab, index) => {
                // Button
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = tab.label;
                btn.onclick = () => switchTab(tab.id);
                tabButtons.appendChild(btn);

                // Panel
                const panel = document.createElement('div');
                panel.id = `panel-${tab.id}`;
                panel.className = `editor-panel ${index === 0 ? 'active' : ''}`;

                const tabData = contentData[tab.id] || {};
                let fieldsHTML = `<h2>${tab.label}</h2>`;

                Object.keys(tabData).forEach(fieldName => {
                    const fieldValue = tabData[fieldName];
                    const fieldId = `field-${tab.id}-${fieldName}`;
                    let inputHTML = '';

                    if (Array.isArray(fieldValue)) {
                        inputHTML = `
                            <div class="editor-section">
                                <label for="${fieldId}"><strong>${fieldName}</strong></label>
                                <textarea id="${fieldId}" onchange="markAsChanged()">${fieldValue.join('\n')}</textarea>
                                <small>Um item por linha</small>
                            </div>
                        `;
                    } else if (typeof fieldValue === 'object' && fieldValue !== null) {
                        inputHTML = `
                            <div class="editor-section">
                                <label for="${fieldId}"><strong>${fieldName}</strong></label>
                                <textarea id="${fieldId}" onchange="markAsChanged()" style="font-size: 0.85em;">${JSON.stringify(fieldValue, null, 2)}</textarea>
                                <small>Conteúdo JSON</small>
                            </div>
                        `;
                    } else {
                        const isImageUrl = fieldValue && fieldValue.toString().match(/\.(png|jpg|jpeg|gif|webp)(\?|$)/i);

                        if (isImageUrl) {
                            inputHTML = `
                                <div class="editor-section">
                                    <label for="${fieldId}"><strong>${fieldName}</strong></label>
                                    <div class="image-preview">
                                        <img id="preview-${fieldId}" src="${fieldValue}" alt="Preview">
                                    </div>
                                    <input type="text" id="${fieldId}" value="${fieldValue}" onchange="markAsChanged(); updateImagePreview('${fieldId}')" placeholder="https://...">
                                    <small>URL da imagem (PNG, JPG, etc.)</small>
                                </div>
                            `;
                        } else {
                            const isLongText = fieldValue && fieldValue.toString().length > 100;
                            if (isLongText) {
                                inputHTML = `
                                    <div class="editor-section">
                                        <label for="${fieldId}"><strong>${fieldName}</strong></label>
                                        <textarea id="${fieldId}" onchange="markAsChanged()">${fieldValue || ''}</textarea>
                                    </div>
                                `;
                            } else {
                                inputHTML = `
                                    <div class="editor-section">
                                        <label for="${fieldId}"><strong>${fieldName}</strong></label>
                                        <input type="text" id="${fieldId}" value="${fieldValue || ''}" onchange="markAsChanged()" placeholder="Digite aqui...">
                                    </div>
                                `;
                            }
                        }
                    }

                    fieldsHTML += inputHTML;
                });

                panel.innerHTML = fieldsHTML;
                container.appendChild(panel);
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.editor-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`panel-${tabId}`).classList.add('active');
            event.target.classList.add('active');
        }

        function markAsChanged() {
            hasChanges = true;
        }

        function updateImagePreview(fieldId) {
            const input = document.getElementById(fieldId);
            const preview = document.getElementById(`preview-${fieldId}`);
            if (preview) {
                preview.src = input.value;
            }
        }

        async function saveChanges() {
            const newContent = {};
            TABS.forEach(tab => {
                newContent[tab.id] = {};
                Object.keys(contentData[tab.id] || {}).forEach(fieldName => {
                    const fieldId = `field-${tab.id}-${fieldName}`;
                    const element = document.getElementById(fieldId);
                    if (element) {
                        const value = element.value;
                        const original = contentData[tab.id][fieldName];
                        
                        if (Array.isArray(original)) {
                            newContent[tab.id][fieldName] = value.split('\n').filter(v => v.trim());
                        } else if (typeof original === 'object' && original !== null) {
                            try {
                                newContent[tab.id][fieldName] = JSON.parse(value);
                            } catch (e) {
                                newContent[tab.id][fieldName] = value;
                            }
                        } else {
                            newContent[tab.id][fieldName] = value;
                        }
                    }
                });
            });

            try {
                const response = await fetch('/api/saveContent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: newContent })
                });

                if (response.ok) {
                    showStatus('✅ Conteúdo salvo com sucesso!', 'success');
                    hasChanges = false;
                    contentData = newContent;
                } else {
                    showStatus('❌ Erro ao salvar', 'error');
                }
            } catch (error) {
                showStatus('❌ Erro: ' + error.message, 'error');
            }
        }

        function resetChanges() {
            location.reload();
        }

        function logout() {
            localStorage.removeItem('adminLogin');
            hideAdmin();
            document.getElementById('loginForm').reset();
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type}`;
            setTimeout(() => el.className = 'status-message', 5000);
        }

        // Carregar ao abrir página
        if (localStorage.getItem('adminLogin')) {
            showAdmin();
            loadContent();
        }
    </script>
</body>
</html>
