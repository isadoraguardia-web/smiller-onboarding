<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Smiller Onboarding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #46a0bf;
            --light-blue: #8fcad8;
            --danger: #e74c3c;
            --success: #27ae60;
            --light-gray: #ecf0f1;
            --dark-gray: #2c3e50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: var(--dark-gray);
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            color: var(--primary-blue);
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #3a8ba3;
        }

        .error {
            color: var(--danger);
            margin-top: 10px;
        }

        .admin-container {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .admin-header h1 {
            color: var(--primary-blue);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px;
            border: 2px solid var(--light-gray);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .editor-panel {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .editor-panel.active {
            display: block;
        }

        .editor-panel h2 {
            color: var(--primary-blue);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--light-blue);
            padding-bottom: 10px;
        }

        .form-field {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid var(--primary-blue);
        }

        .form-field label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark-gray);
        }

        .form-field input,
        .form-field textarea,
        .form-field select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .form-field textarea {
            resize: vertical;
            min-height: 100px;
        }

        .list-items {
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            padding: 15px;
        }

        .list-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }

        .list-item input {
            flex: 1;
        }

        .list-item button {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-item-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }

        .timeline-item-form {
            border: 2px solid var(--light-gray);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            background: white;
        }

        .timeline-item-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid var(--light-gray);
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-end;
        }

        .btn-save {
            background: var(--success);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background: var(--light-gray);
            color: var(--dark-gray);
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .status-message {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .field-info {
            font-size: 0.9em;
            color: #999;
            margin-top: 5px;
            font-style: italic;
        }

        .value-card-form {
            border: 2px solid var(--light-gray);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            background: white;
        }

        .value-card-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid var(--light-gray);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="loginSection">
        <div class="login-box">
            <h1>🔐 Admin Smiller</h1>
            <p>Painel de Edição de Conteúdo</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required value="isadora.guardia@smiller.com.br">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>
                <div class="error" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminSection">
        <div class="admin-header">
            <div>
                <h1>📝 Editor de Conteúdo</h1>
                <p>Edite cada campo com segurança</p>
            </div>
            <button class="btn-logout" onclick="logout()">🚪 Sair</button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="tab-buttons" id="tabButtons"></div>

        <div id="editorsContainer"></div>

        <div class="action-buttons">
            <button class="btn-cancel" onclick="resetChanges()">↻ Descartar</button>
            <button class="btn-save" onclick="saveChanges()">💾 Salvar Tudo</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = '301293';
        const ADMIN_EMAIL = 'isadora.guardia@smiller.com.br';

        // Definição de cada aba com seus campos específicos
        const TABS_CONFIG = {
            inicio: {
                label: 'Início',
                title: 'Bem-vindo ao Time',
                fields: [
                    { name: 'titulo_principal', label: 'Título Principal', type: 'text', placeholder: 'Ex: Bem-vindo ao Time de Customer Experience! 👋' },
                    { name: 'descricao', label: 'Descrição Introdutória', type: 'textarea', placeholder: 'Descreva o documento...' },
                    { name: 'lista_items', label: 'Lista de Itens', type: 'list', help: 'Cada item será exibido com ✅' },
                    { name: 'titulo_primeiro_dia', label: 'Título "Seu Primeiro Dia"', type: 'text' },
                    { name: 'timeline_items', label: 'Timeline do Primeiro Dia', type: 'timeline', help: 'Preencha título e descrição de cada etapa' },
                    { name: 'dica', label: 'Dica Final', type: 'textarea', placeholder: 'Ex: Mantenha este documento aberto...' }
                ]
            },
            empresa: {
                label: 'Sobre Smiller',
                title: 'Sobre a Empresa',
                fields: [
                    { name: 'descricao_empresa', label: 'Descrição da Empresa', type: 'textarea' },
                    { name: 'valor_1_titulo', label: '1º Valor - Título', type: 'text', placeholder: 'Vontade' },
                    { name: 'valor_1_descricao', label: '1º Valor - Descrição', type: 'textarea' },
                    { name: 'valor_2_titulo', label: '2º Valor - Título', type: 'text', placeholder: 'Sinergia' },
                    { name: 'valor_2_descricao', label: '2º Valor - Descrição', type: 'textarea' },
                    { name: 'valor_3_titulo', label: '3º Valor - Título', type: 'text', placeholder: 'Excelência' },
                    { name: 'valor_3_descricao', label: '3º Valor - Descrição', type: 'textarea' },
                    { name: 'valor_4_titulo', label: '4º Valor - Título', type: 'text', placeholder: 'Dinamismo' },
                    { name: 'valor_4_descricao', label: '4º Valor - Descrição', type: 'textarea' },
                    { name: 'valor_5_titulo', label: '5º Valor - Título', type: 'text', placeholder: 'Disciplina' },
                    { name: 'valor_5_descricao', label: '5º Valor - Descrição', type: 'textarea' },
                    { name: 'papel_cx', label: 'Papel do CX (Box de Alerta)', type: 'textarea' },
                    { name: 'responsabilidades', label: 'Responsabilidades Principais', type: 'list' },
                    { name: 'iniciativas', label: 'Iniciativas Atuais', type: 'textarea' }
                ]
            },
            processos: {
                label: 'Processos',
                title: 'Processos e Fluxos',
                fields: [
                    { name: 'descricao_processos', label: 'Descrição geral dos processos', type: 'textarea' },
                    { name: 'processos_items', label: 'Processos (um por linha)', type: 'list' }
                ]
            },
            ferramentas: {
                label: 'Ferramentas',
                title: 'Ferramentas Principais',
                fields: [
                    { name: 'descricao_ferramentas', label: 'Descrição', type: 'textarea' },
                    { name: 'ferramentas_items', label: 'Ferramentas', type: 'list' }
                ]
            },
            escalacao: {
                label: 'Escalação',
                title: 'Decision Tree de Escalação',
                fields: [
                    { name: 'titulo_decision_tree', label: 'Título da Decision Tree', type: 'text' },
                    { name: 'regra_ouro', label: 'Regra de Ouro', type: 'textarea' },
                    { name: 'conteudo_principal', label: 'Conteúdo Principal (HTML ou Texto)', type: 'textarea', help: 'Você pode colar imagens ou HTML aqui' }
                ]
            },
            termometro: {
                label: 'Termometro',
                title: 'Termometro Smiller',
                fields: [
                    { name: 'titulo_termometro', label: 'Título', type: 'text' },
                    { name: 'descricao_termometro', label: 'Descrição', type: 'textarea' },
                    { name: 'url_google_slides', label: 'URL Google Slides', type: 'text', placeholder: 'https://docs.google.com/presentation/...' }
                ]
            },
            mensagens: {
                label: 'Mensagens',
                title: 'Book de Mensagens',
                fields: [
                    { name: 'descricao_mensagens', label: 'Descrição do Book', type: 'textarea' },
                    { name: 'templates', label: 'Templates de Mensagem', type: 'textarea', help: 'Um template por parágrafo/seção' }
                ]
            },
            casos: {
                label: 'Casos Reais',
                title: 'Casos Reais',
                fields: [
                    { name: 'introducao_casos', label: 'Introdução', type: 'textarea' },
                    { name: 'casos_descricao', label: 'Descrição dos Casos', type: 'textarea' }
                ]
            },
            tutoriais: {
                label: 'Tutoriais',
                title: 'Tutoriais',
                fields: [
                    { name: 'descricao_tutoriais', label: 'Descrição', type: 'textarea' },
                    { name: 'links_tutoriais', label: 'Links dos Tutoriais', type: 'list', help: 'Cole os URLs dos tutoriais' }
                ]
            },
            quiz: {
                label: 'Quiz',
                title: 'Quiz de Aprendizado',
                fields: [
                    { name: 'descricao_quiz', label: 'Descrição do Quiz', type: 'textarea' },
                    { name: 'conteudo_quiz', label: 'Conteúdo do Quiz (HTML)', type: 'textarea', help: 'Preencha com as perguntas em HTML' }
                ]
            },
            checklist: {
                label: 'Checklist',
                title: 'Checklist de Onboarding',
                fields: [
                    { name: 'descricao_checklist', label: 'Descrição', type: 'textarea' },
                    { name: 'itens_checklist', label: 'Itens do Checklist', type: 'list' }
                ]
            },
            athena: {
                label: 'Athena',
                title: 'Athena Saúde',
                fields: [
                    { name: 'descricao_athena', label: 'Descrição', type: 'textarea' },
                    { name: 'conteudo_athena', label: 'Conteúdo Principal', type: 'textarea' }
                ]
            }
        };

        let contentData = {};

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                localStorage.setItem('adminLogin', 'true');
                showAdmin();
                loadAndRenderEditor();
            } else {
                document.getElementById('loginError').textContent = 'Email ou senha incorretos';
            }
        });

        function loadAndRenderEditor() {
            // Initialize contentData with empty values
            Object.keys(TABS_CONFIG).forEach(tabId => {
                contentData[tabId] = {};
                TABS_CONFIG[tabId].fields.forEach(field => {
                    contentData[tabId][field.name] = '';
                });
            });

            renderTabs();
        }

        function renderTabs() {
            const tabButtons = document.getElementById('tabButtons');
            const container = document.getElementById('editorsContainer');

            tabButtons.innerHTML = '';
            container.innerHTML = '';

            let isFirst = true;
            Object.keys(TABS_CONFIG).forEach(tabId => {
                const config = TABS_CONFIG[tabId];

                // Create tab button
                const btn = document.createElement('button');
                btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
                btn.textContent = config.label;
                btn.onclick = () => switchTab(tabId);
                tabButtons.appendChild(btn);

                // Create editor panel
                const panel = document.createElement('div');
                panel.id = `panel-${tabId}`;
                panel.className = `editor-panel ${isFirst ? 'active' : ''}`;

                let html = `<h2>${config.title}</h2>`;

                config.fields.forEach(field => {
                    html += renderField(tabId, field);
                });

                panel.innerHTML = html;
                container.appendChild(panel);

                isFirst = false;
            });
        }

        function renderField(tabId, field) {
            const value = contentData[tabId][field.name] || '';

            let html = `<div class="form-field">
                <label for="${tabId}_${field.name}">${field.label}</label>`;

            if (field.type === 'text') {
                html += `<input type="text" id="${tabId}_${field.name}" placeholder="${field.placeholder || ''}" value="${value}">`;
            } else if (field.type === 'textarea') {
                html += `<textarea id="${tabId}_${field.name}" placeholder="${field.placeholder || ''}">${value}</textarea>`;
            } else if (field.type === 'list') {
                const items = value ? value.split('\n') : [];
                html += `<div class="list-items">`;
                items.forEach((item, idx) => {
                    if (item.trim()) {
                        html += `<div class="list-item">
                            <input type="text" value="${item}" data-tabid="${tabId}" data-fieldname="${field.name}" data-idx="${idx}">
                            <button type="button" onclick="removeListItem(this)">✕</button>
                        </div>`;
                    }
                });
                html += `</div>
                <button class="add-item-btn" type="button" onclick="addListItem('${tabId}', '${field.name}')">+ Adicionar Item</button>`;
            } else if (field.type === 'timeline') {
                const items = value ? JSON.parse(value) : [];
                html += `<div>`;
                items.forEach((item, idx) => {
                    html += `<div class="timeline-item-form">
                        <input type="text" placeholder="Título" value="${item.title || ''}" data-tabid="${tabId}" data-field="${field.name}" data-idx="${idx}" data-prop="title">
                        <input type="text" placeholder="Descrição" value="${item.desc || ''}" data-tabid="${tabId}" data-field="${field.name}" data-idx="${idx}" data-prop="desc">
                        <button type="button" onclick="removeTimelineItem(this)">✕ Remover</button>
                    </div>`;
                });
                html += `</div>
                <button class="add-item-btn" type="button" onclick="addTimelineItem('${tabId}', '${field.name}')">+ Adicionar Etapa</button>`;
            }

            if (field.help) {
                html += `<div class="field-info">💡 ${field.help}</div>`;
            }

            html += `</div>`;
            return html;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.editor-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`panel-${tabId}`).classList.add('active');
            event.target.classList.add('active');
        }

        function addListItem(tabId, fieldName) {
            const textarea = document.querySelector(`[data-tabid="${tabId}"][data-fieldname="${fieldName}"]`);
            if (textarea) {
                const newItem = prompt('Digite o novo item:');
                if (newItem) {
                    const items = contentData[tabId][fieldName] ? contentData[tabId][fieldName].split('\n') : [];
                    items.push(newItem);
                    contentData[tabId][fieldName] = items.join('\n');
                    renderTabs();
                }
            }
        }

        function removeListItem(btn) {
            btn.parentElement.remove();
        }

        function addTimelineItem(tabId, fieldName) {
            const items = contentData[tabId][fieldName] ? JSON.parse(contentData[tabId][fieldName]) : [];
            items.push({ title: '', desc: '' });
            contentData[tabId][fieldName] = JSON.stringify(items);
            renderTabs();
        }

        function removeTimelineItem(btn) {
            btn.parentElement.remove();
        }

        async function saveChanges() {
            // Collect all values from inputs
            document.querySelectorAll('[id]').forEach(input => {
                const match = input.id.match(/^(.+?)_(.+)$/);
                if (match) {
                    const [, tabId, fieldName] = match;
                    if (contentData[tabId]) {
                        contentData[tabId][fieldName] = input.value || input.textContent;
                    }
                }
            });

            try {
                // Salvar via API do Vercel
                const response = await fetch('/api/saveContent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: contentData })
                });

                if (response.ok) {
                    showStatus('✅ Conteúdo salvo com sucesso!', 'success');
                    setTimeout(() => loadAndRenderEditor(), 2000);
                } else {
                    throw new Error('Erro ao salvar');
                }
            } catch (error) {
                showStatus('❌ Erro: ' + error.message, 'error');
            }
        }

        function resetChanges() {
            if (confirm('Descartar todas as mudanças?')) {
                loadAndRenderEditor();
                showStatus('Mudanças descartadas', 'success');
            }
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            setTimeout(() => statusEl.classList.remove('success', 'error'), 5000);
        }

        function showAdmin() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('adminLogin');
            location.reload();
        }

        // Check login on load
        if (localStorage.getItem('adminLogin')) {
            showAdmin();
            loadAndRenderEditor();
        }
    </script>
</body>
</html>
